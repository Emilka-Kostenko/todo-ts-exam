<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todolist</title>
  </head>
  <body>
    
    <div class="container">
      <h1>Todo App</h1>
      <form class="todo-form">
        <input type="text" placeholder="Add a new todo" id="todo-input">
        <button type="submit">Add</button>
      </form>
      <p id="error-message">Please enter a todo item</p>
      <input type="text" id="search-input" placeholder="Search todos">
      <div class="filters">
        <button type="button" class="filter-button" data-filter="all">All</button>
        <button type="button" class="filter-button" data-filter="active">Active</button>
        <button type="button" class="filter-button" data-filter="completed">Completed</button>
      </div>
      <div class="progress">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <p id="progress-text">0% completed</p>
      </div>
      <ul class="todo-list" id="todo-list">

      </ul>

      <button type="button" id="clear-completed">Clear completed</button>

      <input type="color" id="colorPicker">
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
